<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
    <div>⏳ Загружаем объекты...</div>
  </div>

  <div id="welcomeScreen" class="screen welcome hidden">
    <div class="welcome-brand">
      <img src="favicon.png" alt="Logo" class="logo">
      <div class="brand-name">ГАБ КАЛЬКУЛЯТОР</div>
    </div>
    <div class="welcome-media">
      <video id="welcomeVideo" autoplay muted loop playsinline style="display: none;"></video>
      <img id="welcomeImage" src="hero.png" alt="Welcome" style="display: block;">
    </div>
    <div class="welcome-text">
      <h1>НАДЁЖНЫЙ ДОХОДНЫЙ</h1>
      <p>Готовый Арендный Бизнес</p>
    </div>
    <button class="btn-start" onclick="startApp()">ЗДЕСЬ</button>
  </div>

  <div id="mainScreen" class="screen main hidden">
    <header class="main-header">
      <button id="backBtn" class="back-btn hidden" onclick="goBack()">← Назад</button>
      <h2> ГАБ Калькулятор</h2>
    </header>
    <div class="filters-section">
      <button class="filters-toggle" onclick="toggleFilters()">🔽 Фильтры</button>
      <div id="filtersBlock" class="filters-block hidden">
        <div class="filter-group">
          <label> Город</label>
          <select id="cityFilter"><option value="">Все города</option></select>
        </div>
        <div class="filter-group">
          <label>🏢 Тип объекта</label>
          <select id="typeFilter"><option value="">Все типы</option></select>
        </div>
      </div>
    </div>
    <div class="view-toggle">      <button class="view-btn active" onclick="switchView('list')">📋 Список</button>
      <button class="view-btn" onclick="switchView('calc')">🧮 Калькулятор</button>
    </div>
    <div id="objectsList" class="list"></div>
    <div id="calcContainer" class="calculator hidden">
      <h3>🧮 Калькулятор доходности</h3>
      <div class="input-group">
        <label>Цена объекта (₽)</label>
        <input type="number" id="calcPrice" placeholder="10000000">
      </div>
      <div class="input-group">
        <label>Аренда в месяц (₽)</label>
        <input type="number" id="calcRent" placeholder="80000">
      </div>
      <button class="tg-btn" onclick="calculateYield()">Рассчитать</button>
      <div id="calcResult" class="result hidden"></div>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
     
      <div id="objectDetails">
        <img id="modalImg" class="modal-img" src="" alt="">
        <h2 id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-yield" id="modalYield"></div>
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-section">
          <h3>📖 Описание</h3>
          <p id="modalDesc"></p>
        </div>
      </div>

      <div id="leadForm" class="hidden" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
        <h3 style="margin-bottom: 15px; text-align: center;">📝 Оставьте заявку</h3>
        <div class="input-group">
          <label>Ваше имя *</label>
          <input type="text" id="leadName" placeholder="Иван">
        </div>
        <div class="input-group">
          <label>Телефон *</label>
          <input type="tel" id="leadPhone" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="input-group">
          <label>Telegram (необязательно)</label>
          <input type="text" id="leadTelegram" placeholder="@username">
        </div>
        <button class="tg-btn" id="submitLeadBtn" onclick="submitLead()">Отправить заявку</button>        <button class="tg-btn secondary" style="margin-top: 8px;" onclick="cancelLead()">Отмена</button>
      </div>

      <div id="modalActions" class="modal-actions">
        <button class="tg-btn" onclick="openLeadForm()">📞 Связаться с брокером</button>
        <button class="tg-btn secondary" onclick="copyLink()">🔗 Копировать ссылку</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
