<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>ГАБ Калькулятор</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; --primary-hover: #1d4ed8;
      --success: #10b981; --warning: #f59e0b; --text: #0f172a; --text-sec: #64748b;
      --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1); --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.5; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { margin: 0; font-size: 28px; color: var(--primary); letter-spacing: -0.5px; }
    header .hint { color: var(--text-sec); font-size: 15px; margin-top: 8px; }
    .filters { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 13px; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; }
    select, input[type="range"] { width: 100%; }
    select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; }
    .yield-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .yield-row label { margin: 0; white-space: nowrap; }
    .yield-val { font-weight: bold; color: var(--primary); }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; overflow: hidden; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .card-img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; background: #f1f5f9; }
    .card-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sec); margin-bottom: 10px; }
    .card-badge { background: #dbeafe; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    .card h3 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; }
    .card-price { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 5px; }
    .card-rent { font-size: 14px; color: var(--text-sec); margin-bottom: 15px; }
    .card-actions { display: flex; gap: 10px; margin-bottom: 10px; }
    .card-links { display: flex; gap: 8px; }
    .btn { border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-sec); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-small { padding: 8px; font-size: 13px; }
    .calculator { background: var(--card); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 20px; }
    .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .obj-badge { background: #eff6ff; border-left: 4px solid var(--primary); padding: 12px; border-radius: 6px; flex: 1; margin-right: 15px; }
    .obj-badge-title { font-weight: bold; font-size: 16px; }    .obj-badge-loc { font-size: 13px; color: var(--text-sec); }
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; color: var(--text-sec); margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .result-block { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; }
    .res-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
    .payback-box { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; border-radius: 12px; padding: 20px; text-align: center; margin-top: 15px; }
    .payback-box span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #92400e; opacity: 0.8; }
    .payback-box strong { display: block; font-size: 28px; font-weight: 800; color: #b45309; margin-top: 5px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); box-shadow: var(--shadow-lg); position: relative; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; z-index: 10; }
    .modal-img { width: 100%; height: 200px; object-fit: cover; }
    .modal-body { padding: 25px; }
    .modal-title { font-size: 24px; margin: 0 0 10px; }
    .modal-price { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
    .modal-info { margin-bottom: 20px; }
    .modal-info div { margin-bottom: 8px; font-size: 15px; }
    .modal-info b { color: var(--text-sec); font-weight: 500; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .hidden { display: none !important; }
    .error-box { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 600px; text-align: center; }
    .error-box h3 { margin: 0 0 10px; }
    .error-box code { display: block; background: #fef2f2; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 12px; word-break: break-all; }
    .retry-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-size: 14px; }
    @media (max-width: 600px) { .filters, .calc-grid, .list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="errorContainer"></div>
    <header><h1>🏢 ГАБ Калькулятор</h1><p class="hint">Готовый Арендный Бизнес: выберите объект и посчитайте доход</p></header>
    <section class="filters">
      <div class="filter-group"><label>Город</label><select id="cityFilter"><option value="all">Все города</option></select></div>
      <div class="filter-group"><label>Тип объекта</label>
        <select id="typeFilter">
          <option value="all">Все типы</option><option value="retail">Стрит-ритейл</option><option value="office">Офис</option>
          <option value="warehouse">Склад</option><option value="apartments">Апартаменты</option><option value="hypermarket">Гипермаркет</option>
          <option value="pvz">ПВЗ</option><option value="pharmacy">Аптека</option><option value="combo">Комбо</option><option value="darkstore">Даркстор</option><option value="other">Другое</option>
        </select>
      </div>
      <div class="yield-row"><label>Мин. доходность:</label><input type="range" id="yieldFilter" min="4" max="15" value="8" step="0.5"><span class="yield-val" id="yieldVal">8%</span></div>
    </section>
    <section id="objectsList" class="list"><p style="grid-column:1/-1; text-align:center; color:var(--text-sec); padding:40px;">⏳ Загрузка базы...</p></section>
    <section class="calculator">
      <div class="calc-header">
        <div id="selectedObject" class="obj-badge hidden"><div class="obj-badge-title" id="selName"></div><div class="obj-badge-loc" id="selLoc"></div></div>
        <button id="shareCalcBtn" class="btn btn-outline" style="width:auto; display:none;">📤 Поделиться</button>      </div>
      <div class="calc-grid">
        <div class="input-group"><label>Цена объекта (₽)</label><input type="number" id="calcPrice"></div>
        <div class="input-group"><label>Аренда/мес (₽)</label><input type="number" id="calcRent"></div>
      </div>
      <button id="calcBtn" class="btn btn-primary" style="width:100%">Рассчитать доходность</button>
      <div id="calcResult" class="result-block hidden">
        <div class="res-row"><span>💰 Чистый доход/мес:</span><strong id="resMonthly" style="color:var(--success)">0 ₽</strong></div>
        <div class="res-row"><span>📈 Годовая доходность:</span><strong id="resYield" style="color:var(--primary)">0%</strong></div>
        <div class="payback-box"><span>⏳ Полная окупаемость</span><strong id="resPayback">0 лет</strong></div>
      </div>
    </section>
  </div>
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img id="modalImg" class="modal-img" src="" alt="Фото объекта">
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-info">
          <div><b>Город:</b> <span id="modalCity"></span></div>
          <div><b>Адрес:</b> <span id="modalLoc"></span></div>
          <div><b>Тип:</b> <span id="modalType"></span></div>
          <div><b>Доходность:</b> <span id="modalYield"></span></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="modalCalcBtn" style="flex:2">📥 В калькулятор</button>
          <button class="btn btn-outline" id="modalContactBtn">💬</button>
          <button class="btn btn-outline" id="modalCopyLinkBtn">🔗</button>
          <button class="btn btn-outline" id="modalShareBtn">📤</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
      // ✅ ЖЁСТКО УКАЗЫВАЕМ ЛИСТ. Если ваша вкладка называется иначе, поменяйте Sheet1 на точное имя вкладки
      const SHEET_NAME = 'Sheet1';
      const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(SHEET_NAME)}&v=${Date.now()}`;
     
      const CONTACT_LINK = 'https://t.me/ernest_812';
      const BASE_URL = window.location.href.split('#')[0];
      const errorContainer = document.getElementById('errorContainer');

      console.log('🚀 [INIT] Запуск приложения...');
      console.log('🔗 URL загрузки:', SHEET_URL);
      const els = {
        list: document.getElementById('objectsList'), cityFilter: document.getElementById('cityFilter'),
        typeFilter: document.getElementById('typeFilter'), yieldFilter: document.getElementById('yieldFilter'),
        yieldVal: document.getElementById('yieldVal'), calcPrice: document.getElementById('calcPrice'),
        calcRent: document.getElementById('calcRent'), calcBtn: document.getElementById('calcBtn'),
        calcResult: document.getElementById('calcResult'), resMonthly: document.getElementById('resMonthly'),
        resYield: document.getElementById('resYield'), resPayback: document.getElementById('resPayback'),
        selectedObject: document.getElementById('selectedObject'), selName: document.getElementById('selName'),
        selLoc: document.getElementById('selLoc'), shareCalcBtn: document.getElementById('shareCalcBtn'),
        modalOverlay: document.getElementById('modalOverlay'), modalImg: document.getElementById('modalImg'),
        modalTitle: document.getElementById('modalTitle'), modalPrice: document.getElementById('modalPrice'),
        modalCity: document.getElementById('modalCity'), modalLoc: document.getElementById('modalLoc'),
        modalType: document.getElementById('modalType'), modalYield: document.getElementById('modalYield'),
        modalCalcBtn: document.getElementById('modalCalcBtn'), modalContactBtn: document.getElementById('modalContactBtn'),
        modalCopyLinkBtn: document.getElementById('modalCopyLinkBtn'), modalShareBtn: document.getElementById('modalShareBtn')
      };

      let objects = [], currentObj = null;
      function fmt(n) { return new Intl.NumberFormat('ru-RU').format(Math.round(n)); }
     
      function formatInput(input) {
        input.addEventListener('blur', () => { if(input.value) input.value = fmt(input.value); });
        input.addEventListener('focus', () => { if(input.value) input.value = input.value.replace(/\s/g, ''); });
      }
      formatInput(els.calcPrice); formatInput(els.calcRent);

      function parseCSV(csv) {
        const lines = csv.split(/\r?\n/).filter(l => l.trim());
        console.log(`📊 Всего строк в файле: ${lines.length}`);
        if(lines.length < 2) { console.error('❌ Файл пуст или содержит только заголовки'); return []; }
       
        const res = [];
        for(let i=1; i<lines.length; i++) {
          const row = lines[i].match(/(".*?"|[^",\n]+)(?=\s*,|\s*$)/g) || [];
          const c = row.map(v => v.replace(/^"|"$/g, '').trim());
          if(c.length >= 9) { // Проверяем, что есть все 9 столбцов
            const price = parseFloat(c[3])||0, rent = parseFloat(c[4])||0;
            let y = parseFloat(c[5]); if(!y && price>0) y = (rent*12/price)*100;
            res.push({ id: c[0], title: c[1], type: c[2], price, rent, yield: y||0, city: c[6]||'', location: c[7]||'', photo: c[8]||'' });
          } else {
            console.warn(`️ Строка ${i+1} пропущена: мало столбцов (${c.length} из 9)`);
          }
        }
        console.log(`✅ Успешно распарсено объектов: ${res.length}`);
        return res;
      }

      function populateCities() {
        const fixedOrder = ['Москва', 'Московская область', 'Санкт-Петербург', 'Ленинградская область', 'Другое'];
        const allCities = [...new Set(objects.map(o => o.city).filter(Boolean))];        const sortedCities = fixedOrder.filter(c => allCities.includes(c)).concat(allCities.filter(c => !fixedOrder.includes(c)).sort());
        els.cityFilter.innerHTML = '<option value="all">Все города</option>' + sortedCities.map(c => `<option value="${c}">${c}</option>`).join('');
      }

      function showError(title, message, details = '') {
        errorContainer.innerHTML = `<div class="error-box"><h3>⚠️ ${title}</h3><p>${message}</p>${details ? `<code>${details}</code>` : ''}<button class="retry-btn" onclick="location.reload()">🔄 Обновить</button></div>`;
        els.list.innerHTML = '';
      }

      async function loadData() {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);
         
          console.log('📡 Запрос к Google Sheets...');
          const res = await fetch(SHEET_URL, { signal: controller.signal });
          clearTimeout(timeoutId);
         
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
         
          const csv = await res.text();
          console.log('📥 CSV получен. Размер:', csv.length, 'символов');
         
          objects = parseCSV(csv);
          if(objects.length === 0) {
            showError('Нет данных', 'В листе "' + SHEET_NAME + '" не найдено объектов. Проверьте, что данные находятся в 9 столбцах (A-I) и лист называется именно так.', 'Столбцов в файле: ' + csv.split(/\r?\n/)[1]?.split(',').length);
            return;
          }
         
          populateCities();
          renderList();
          console.log('✅ Загрузка завершена успешно');
         
          const hash = window.location.hash.replace('#obj-','');
          if(hash) { const obj = objects.find(o => o.id == hash); if(obj) openModal(obj); }
        } catch(e) {
          console.error('❌ Ошибка:', e);
          let msg = 'Не удалось загрузить таблицу';
          let details = e.message;
          if(e.name === 'AbortError') { msg = 'Таймаут (8 сек)'; details = 'Google не отвечает. Проверьте интернет или доступ к таблице.'; }
          showError('Ошибка подключения', msg, details);
        }
      }

      function copyLink(url, title) {
        navigator.clipboard.writeText(url).then(() => alert(`🔗 Ссылка на "${title}" скопирована!`)).catch(() => alert('❌ Не удалось скопировать'));
      }

      async function shareObject(obj) {
        const text = `🏢 ${obj.title}\n💰 ${fmt(obj.price)} ₽\n📈 ${obj.yield.toFixed(1)}%\n📍 ${obj.city}\n\nСмотреть: ${BASE_URL}#obj-${obj.id}`;        if(navigator.share) { try { await navigator.share({title: obj.title, text}); } catch(e){} }
        else { navigator.clipboard.writeText(text); alert(' Скопировано!'); }
      }

      function renderList() {
        const city = els.cityFilter.value, type = els.typeFilter.value, minY = parseFloat(els.yieldFilter.value);
        els.yieldVal.textContent = minY + '%';
        const filtered = objects.filter(o => (city==='all' || o.city===city) && (type==='all' || o.type===type) && o.yield >= minY);
       
        if(filtered.length===0) { els.list.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-sec);padding:40px">Нет объектов по фильтру</p>'; return; }
       
        els.list.innerHTML = filtered.map(o => {
          const link = `${BASE_URL}#obj-${o.id}`;
          const safeTitle = o.title.replace(/'/g,"\\'");
          return `
          <div class="card" onclick="openModalById('${o.id}')">
            <img class="card-img" src="${o.photo || 'https://via.placeholder.com/400x200?text=Нет+фото'}" loading="lazy">
            <div class="card-meta"><span>📍 ${o.city}</span><span class="card-badge">≈${o.yield.toFixed(1)}%</span></div>
            <h3>${o.title}</h3>
            <div class="card-price">${fmt(o.price)} ₽</div>
            <div class="card-rent">Аренда: ${fmt(o.rent)} ₽/мес</div>
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="btn btn-primary" onclick="loadToCalc(${o.price},${o.rent},'${safeTitle}','${o.city}, ${o.location}')">📥 Калькулятор</button>
              <button class="btn btn-outline" onclick="event.stopPropagation(); window.open('${CONTACT_LINK}?text=Интересует: ${o.title.replace(/'/g, "%27")}')">💬</button>
            </div>
            <div class="card-links" onclick="event.stopPropagation()">
              <button class="btn btn-outline btn-small" onclick="copyLink('${link}', '${safeTitle}')">🔗 Копировать</button>
              <button class="btn btn-outline btn-small" onclick="shareObjectById('${o.id}')">📤 Поделиться</button>
            </div>
          </div>`;
        }).join('');
      }

      window.shareObjectById = function(id) { const obj = objects.find(o=>o.id==id); if(obj) shareObject(obj); };
      window.openModalById = function(id) { const obj = objects.find(o=>o.id==id); if(obj) openModal(obj); };
     
      function openModal(obj) {
        currentObj = obj;
        els.modalImg.src = obj.photo || 'https://via.placeholder.com/400x200?text=Нет+фото';
        els.modalTitle.textContent = obj.title; els.modalPrice.textContent = fmt(obj.price) + ' ₽';
        els.modalCity.textContent = obj.city; els.modalLoc.textContent = obj.location;
        els.modalType.textContent = obj.type; els.modalYield.textContent = obj.yield.toFi
