<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="loadingScreen" class="loading-screen hidden">
    <div class="spinner"></div>
    <div>⏳ Загружаем...</div>
  </div>

  <!-- ПРИВЕТСТВИЕ -->
  <div id="welcomeScreen" class="screen welcome hidden">
    <div class="welcome-brand">
      <img src="favicon.png" alt="Logo" class="logo">
      <div class="brand-name">ГАБ КАЛЬКУЛЯТОР</div>
    </div>

    <div class="welcome-media">
      <!-- Видео по умолчанию скрыто через CSS класс -->
      <video id="welcomeVideo" autoplay muted loop playsinline class="hidden-video"></video>
      <!-- Фото по умолчанию показано -->
      <img id="welcomeImage" src="hero.png" alt="Welcome" class="welcome-img">
    </div>

    <div class="welcome-text">
      <h1>ГАБ Калькулятор</h1>
      <p>Готовый арендный бизнес</p>
    </div>

    <button class="btn-start" onclick="startApp()">Начать подбор</button>
  </div>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <div id="mainScreen" class="screen main hidden">
    <header class="main-header">
      <h2>🏠 Объекты</h2>
    </header>
    <div id="objectsList" class="list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
