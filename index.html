<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ГАБ Калькулятор</h1>
      <p class="hint">Подбор готового арендного бизнеса для пассивного дохода</p>
    </header>

    <section class="filters">
      <label>Город
        <select id="cityFilter">
          <option value="">Все города</option>
          <option value="Москва">Москва</option>
          <option value="Санкт-Петербург">Санкт-Петербург</option>
          <option value="Московская">Московская область</option>
        </select>
      </label>
      <label>Тип объекта
        <select id="typeFilter">
          <option value="">Все типы</option>
          <option value="pharmacy">Аптека</option>
          <option value="hypermarket">Супермаркет</option>
          <option value="pvz">ПВЗ</option>
          <option value="darkstore">Даркстор</option>
          <option value="combo">Комбо</option>
          <option value="other">Другое</option>
        </select>
      </label>
      <label>Доходность: <span id="yieldValue">0%</span>
        <input type="range" id="yieldFilter" min="0" max="30" value="0" />
      </label>
    </section>

    <section class="calculator" id="calculatorSection">
      <h2>🧮 Калькулятор доходности</h2>
      <div class="input-group">
        <label>Цена объекта (₽)
          <input type="number" id="calcPrice" placeholder="5 000 000" />
        </label>
        <label>Аренда в месяц (₽)
          <input type="number" id="calcRent" placeholder="40 000" />
        </label>        <button class="tg-btn" id="calcBtn">Рассчитать</button>
      </div>
      <div id="calcResult" class="result hidden">
        <div class="res-row"><span>Доход в месяц:</span><span id="resMonthly">—</span></div>
        <div class="res-row"><span>Доходность:</span><span id="resYield">—</span></div>
        <div class="res-row"><span>Окупаемость:</span><span id="resPayback">—</span></div>
        <button class="tg-btn" id="shareCalcBtn" style="margin-top:12px;display:none">↗️ Поделиться расчётом</button>
      </div>
      <div id="selectedObject" class="hidden" style="margin-top:12px;padding:12px;background:var(--secondary-bg);border-radius:10px">
        <strong id="selName"></strong><br>
        <small id="selLoc" style="color:var(--hint)"></small>
      </div>
    </section>

    <section id="objectsList" class="list">
      <div class="loading">⏳ Загружаем объекты...</div>
    </section>
  </div>

  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img id="modalImg" src="" alt="" class="modal-img" />
      <h3 id="modalTitle"></h3>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-meta">
        <span id="modalCity"></span> • <span id="modalLoc"></span> • <span id="modalType"></span>
      </div>
      <div class="modal-yield" id="modalYieldLabel">Доходность: <strong id="modalYield">0%</strong></div>
     
      <div id="modalDescription" class="modal-description hidden"></div>
     
      <div class="modal-actions">
        <button class="tg-btn" id="modalCalcBtn">💰 Рассчитать доходность</button>
        <button class="tg-btn" id="modalContactBtn" style="background:var(--secondary-bg);color:var(--btn-bg)">📞 Связаться</button>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="card-btn" id="modalCopyLinkBtn">🔗 Копировать ссылку</button>
          <button class="card-btn" id="modalShareBtn">↗️ Поделиться</button>
        </div>
      </div>

      <div id="modalCalcResult" class="hidden" style="margin-top:16px; padding:12px; background:var(--secondary-bg); border-radius:10px; border-left: 4px solid var(--btn-bg);">
        <div style="font-size:14px; margin-bottom:4px;">💰 Доход в месяц: <strong id="mResMonthly"></strong></div>
        <div style="font-size:14px; margin-bottom:4px;">📈 Доходность: <strong id="mResYield"></strong></div>
        <div style="font-size:14px; margin-bottom:12px;">⏳ Окупаемость: <strong id="mResPayback"></strong></div>
        <button class="tg-btn" id="modalShareCalcBtn" style="font-size:14px; padding:10px;">↗️ Поделиться расчётом</button>
      </div>

    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    // ==================== НАСТРОЙКИ ====================
    const BASE_URL = window.location.origin + window.location.pathname;
    const CONTACT_LINK = 'https://t.me/newgab_bot';
    const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
    const SHEET_NAME = 'Sheet1';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    const CACHE_DURATION = 6 * 60 * 60 * 1000;

    // Base64 encoded SVG placeholder — 100% надёжно
    const PLACEHOLDER_SVG = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iNDAwIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjMzM5MGVjIi8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjMjU2M2ViIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNnKSIvPjx0ZXh0IHg9IjUwJSIgeT0iNDUlIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjI4IiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPldhc2ggR290b3Z5aTwvdGV4dD48dGV4dCB4PSI1MCUiIHk9IjU4JSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyOCIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IndoaXRlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5BcmVuZG55eSBCaXpuZXM8L3RleHQ+PHRleHQgeD0iNTAlIiB5PSI3NSUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWksIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IndoaXRlIiBvcGFjaXR5PSIwLjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkdBQiBLYWxrdWx5YXRvcjwvdGV4dD48L3N2Zz4=';

    let tg = null;
    let isInTelegram = false;
   
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        isInTelegram = tg.initData !== '' && tg.initData !== undefined;
       
        if (isInTelegram) {
          tg.ready();
          tg.expand();
          if (tg.themeParams) {
            document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
            document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#3390ec');
            document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
          }
        }
      }
    } catch (e) { console.warn('Telegram WebApp error:', e); }

    const fmt = (num) => new Intl.NumberFormat('ru-RU').format(num);
   
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('🔗 Ссылка скопирована!');
      }).catch(() => showToast('❌ Ошибка', 'error'));    }

    async function shareObject(obj) {
      const shareUrl = BASE_URL + '#obj-' + obj.id;
      const shareText = '🏠 ' + obj.title + '\n💰 ' + fmt(obj.price) + ' ₽\n📈 ' + obj.yield.toFixed(1) + '% доходность';

      if (isInTelegram && tg) {
        try {
          tg.openLink('https://t.me/share/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(shareText));
          showToast('↗️ Выберите чат для отправки');
          return;
        } catch (e) { console.warn('tg.openLink error:', e); }
      }

      if (navigator.share) {
        try {
          await navigator.share({ title: obj.title, text: shareText, url: shareUrl });
          return;
        } catch (e) {
          if (e.name !== 'AbortError') console.warn('navigator.share error:', e);
        }
      }

      copyLink(shareUrl);
    }

    let objects = [], filtered = [], currentObj = null;

    function calculateYield(price, rent) {
      if (!price || !rent || price <= 0 || rent <= 0) return 0;
      return ((rent * 12) / price) * 100;
    }

    function saveToCache(data) {
      try {
        localStorage.setItem('gab_objects', JSON.stringify({ data, timestamp: Date.now() }));
      } catch (e) { console.warn('Cache save error:', e); }
    }

    function getFromCache() {
      try {
        const cached = localStorage.getItem('gab_objects');
        if (!cached) return null;
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp > CACHE_DURATION) {
          localStorage.removeItem('gab_objects');
          return null;
        }
        return data;
      } catch (e) { return null; }    }

    async function loadData() {
      const listEl = document.getElementById('objectsList');
      const cachedData = getFromCache();
     
      if (cachedData) {
        objects = cachedData;
        filtered = [...objects];
        renderList();
        showToast('✅ Загружено из кэша', 'success');
      } else {
        listEl.innerHTML = '<div class="loading">⏳ Загружаем объекты...</div>';
      }
     
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows.filter(r => r.c && r.c[0] && r.c[0].v != null);
       
        if (rows.length === 0) throw new Error("Таблица пуста");

        objects = rows.map(r => {
          const price = Number(r.c[3]?.v) || 0;
          const rent = Number(r.c[4]?.v) || 0;
          const sheetYield = Number(r.c[5]?.v) || 0;
          const finalYield = sheetYield > 0 ? sheetYield : calculateYield(price, rent);
         
          return {
            id: r.c[0]?.v || '',
            title: r.c[1]?.v || 'Без названия',
            type: r.c[2]?.v || '',
            price, rent,
            yield: finalYield,
            city: r.c[6]?.v || '',
            location: r.c[7]?.v || '',
            photo_url: r.c[8]?.v || '',
            description: r.c[9]?.v || ''
          };
        });
       
        saveToCache(objects);
        filtered = [...objects];
        renderList();
        if (!cachedData) showToast('✅ Загружено ' + objects.length + ' объектов', 'success');
      } catch (e) {
        console.error(e);
        if (objects.length === 0) {
          listEl.innerHTML = '<div class="error">❌ Ошибка загрузки.<br><small>' + e.message + '</small></div>';        } else {
          showToast('⚠️ Нет сети, показываем кэш', 'error');
        }
      }
    }

    function renderList() {
      const listEl = document.getElementById('objectsList');
      const city = document.getElementById('cityFilter').value;
      const type = document.getElementById('typeFilter').value;
      const minYield = Number(document.getElementById('yieldFilter').value);
     
      document.getElementById('yieldValue').textContent = minYield + '%';
     
      filtered = objects.filter(o =>
        (!city || o.city.includes(city)) &&
        (!type || o.type === type) &&
        (o.yield >= minYield)
      );
     
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">😕 Объекты не найдены</div>';
        return;
      }
     
      listEl.innerHTML = filtered.map((obj) => `
        <div class="card" onclick="openModal(objects.find(o=>o.id=='${obj.id}'))">
          <div class="card-meta">
            <span>${obj.city || ''}</span>
            <span class="card-yield">Доходность: ${obj.yield.toFixed(1)}%</span>
          </div>
          <h3>${obj.title}</h3>
          <div class="card-price">${fmt(obj.price)} ₽</div>
          <small>Аренда: ${fmt(obj.rent)} ₽/мес</small>
          <div style="display:flex;gap:8px;margin-top:8px">
             <button class="card-btn btn-copy" onclick="event.stopPropagation();copyLink('${BASE_URL}#obj-${obj.id}')">🔗 Копировать ссылку</button>
             <button class="card-btn btn-share" onclick="event.stopPropagation();shareObject(objects.find(o=>o.id=='${obj.id}'))">↗️ Поделиться</button>
          </div>
        </div>
      `).join('');
    }

    function openModal(obj) {
      currentObj = obj;
      // ВАЖНО: Сначала устанавливаем src, потом показываем
      const imgEl = document.getElementById('modalImg');
      imgEl.src = obj.photo_url || PLACEHOLDER_SVG;
      imgEl.style.display = 'block';
      imgEl.style.width = '100%';
      imgEl.style.height = '200px';      imgEl.style.objectFit = 'cover';
      imgEl.style.borderRadius = '12px';
      imgEl.style.marginBottom = '12px';
      imgEl.style.background = '#f0f2f5';
     
      document.getElementById('modalTitle').textContent = obj.title;
      document.getElementById('modalPrice').textContent = fmt(obj.price) + ' ₽';
      document.getElementById('modalCity').textContent = obj.city;
      document.getElementById('modalLoc').textContent = obj.location;
      document.getElementById('modalType').textContent = obj.type;
      document.getElementById('modalYield').textContent = obj.yield.toFixed(1) + '%';
     
      const descEl = document.getElementById('modalDescription');
      if (obj.description && obj.description.trim() !== '') {
        descEl.textContent = obj.description;
        descEl.className = 'modal-description';
        descEl.style.cssText = 'margin-top:12px; padding:12px; background:var(--secondary-bg); border-radius:10px; font-size:14px; line-height:1.5;';
      } else {
        descEl.className = 'modal-description hidden';
      }
     
      document.getElementById('modalCalcResult').classList.add('hidden');
      document.getElementById('modalOverlay').classList.add('active');
      history.pushState({modal:true}, '', '#obj-'+obj.id);
    }

    window.closeModal = () => {
      document.getElementById('modalOverlay').classList.remove('active');
      if(history.state?.modal) history.back();
    };

    document.getElementById('modalCalcBtn').onclick = () => {
      const p = currentObj.price;
      const r = currentObj.rent;
      const annual = r * 12;
      const y = (annual / p) * 100;
      const pay = p / annual;
     
      document.getElementById('mResMonthly').textContent = fmt(r) + ' ₽';
      document.getElementById('mResYield').textContent = y.toFixed(2) + '%';
      document.getElementById('mResPayback').textContent = pay.toFixed(1) + ' лет';
      document.getElementById('modalCalcResult').classList.remove('hidden');
    };
   
    document.getElementById('modalShareCalcBtn').onclick = async () => {
      const text = `🧮 Расчёт: ${currentObj.title}\n💰 ${document.getElementById('mResMonthly').textContent}\n📈 ${document.getElementById('mResYield').textContent}`;
      if (isInTelegram && tg) {
        tg.openLink('https://t.me/share/url?url=' + encodeURIComponent(BASE_URL) + '&text=' + encodeURIComponent(text));
        showToast('↗️ Выберите чат');
      } else if (navigator.share) {        try { await navigator.share({ title: 'ГАБ Расчёт', text, url: BASE_URL }); }
        catch (e) { if (e.name !== 'AbortError') copyLink(BASE_URL); }
      } else { copyLink(BASE_URL); }
    };

    document.getElementById('modalShareBtn').onclick = () => shareObject(currentObj);
    document.getElementById('modalCopyLinkBtn').onclick = () => copyLink(BASE_URL + '#obj-' + currentObj.id);
   
    document.getElementById('calcBtn').onclick = calculate;
    function calculate() {
      const p = parseFloat(document.getElementById('calcPrice').value) || 0;
      const r = parseFloat(document.getElementById('calcRent').value) || 0;
      if(p<=0 || r<=0) return;
      const annual = r*12, y = (annual/p)*100, pay = p/annual;
      document.getElementById('resMonthly').textContent = fmt(r) + ' ₽';
      document.getElementById('resYield').textContent = y.toFixed(2) + '%';
      document.getElementById('resPayback').textContent = pay.toFixed(1) + ' лет';
      document.getElementById('calcResult').classList.remove('hidden');
      document.getElementById('shareCalcBtn').style.display = 'block';
    }
   
    document.getElementById('shareCalcBtn').onclick = async () => {
      const text = `🧮 Расчёт ГАБ\n💰 ${document.getElementById('resMonthly').textContent}\n📈 ${document.getElementById('resYield').textContent}`;
      if (isInTelegram && tg) {
        tg.openLink('https://t.me/share/url?url=' + encodeURIComponent(BASE_URL) + '&text=' + encodeURIComponent(text));
      } else if (navigator.share) {
        try { await navigator.share({ title: 'ГАБ', text, url: BASE_URL }); }
        catch { copyLink(BASE_URL); }
      } else { copyLink(BASE_URL); }
    };

    document.getElementById('cityFilter').onchange = renderList;
    document.getElementById('typeFilter').onchange = renderList;
    document.getElementById('yieldFilter').oninput = renderList;

    window.addEventListener('load', () => {
      loadData();
      if(window.location.hash.startsWith('#obj-')) {
        const id = window.location.hash.replace('#obj-','');
        setTimeout(() => {
          const obj = objects.find(o=>o.id==id);
          if(obj) openModal(obj);
        }, 300);
      }
    });
  </script>
</body>
</html>
