<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://docs.google.com" />
</head>
<body>
  <div class="container">
    <header>
      <h1>ГАБ Калькулятор</h1>
      <p class="hint">Подбор готового арендного бизнеса для пассивного дохода</p>
    </header>

    <section class="filters">
      <label>Город
        <select id="cityFilter">
          <option value="">Все города</option>
          <option value="Москва">Москва</option>
          <option value="Санкт-Петербург">Санкт-Петербург</option>
          <option value="Московская">Московская область</option>
        </select>
      </label>
      <label>Тип объекта
        <select id="typeFilter">
          <option value="">Все типы</option>
          <option value="pharmacy">Аптека</option>
          <option value="hypermarket">Супермаркет</option>
          <option value="pvz">ПВЗ</option>
          <option value="darkstore">Даркстор</option>
          <option value="combo">Комбо</option>
          <option value="other">Другое</option>
        </select>
      </label>
      <label>Доходность: <span id="yieldValue">0%</span>
        <input type="range" id="yieldFilter" min="0" max="30" value="0" />
      </label>
    </section>

    <section class="calculator" id="calculatorSection">
      <h2>🧮 Калькулятор доходности</h2>
      <div class="input-group">
        <label>Цена объекта (₽)
          <input type="number" id="calcPrice" placeholder="5 000 000" />
        </label>
        <label>Аренда в месяц (₽)
          <input type="number" id="calcRent" placeholder="40 000" />        </label>
        <button class="tg-btn" id="calcBtn">Рассчитать</button>
      </div>
      <div id="calcResult" class="result hidden">
        <div class="res-row"><span>Доход в месяц:</span><span id="resMonthly">—</span></div>
        <div class="res-row"><span>Доходность:</span><span id="resYield">—</span></div>
        <div class="res-row"><span>Окупаемость:</span><span id="resPayback">—</span></div>
        <button class="tg-btn" id="shareCalcBtn" style="margin-top:12px;display:none">↗️ Поделиться расчётом</button>
      </div>
      <div id="selectedObject" class="hidden" style="margin-top:12px;padding:12px;background:var(--secondary-bg);border-radius:10px">
        <strong id="selName"></strong><br>
        <small id="selLoc" style="color:var(--hint)"></small>
      </div>
    </section>

    <section id="objectsList" class="list">
      <div class="loading">⏳ Загружаем объекты...</div>
    </section>
  </div>

  <!-- Модалка -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="closeModalBtn">×</button>
      <div style="width:100%;height:200px;border-radius:12px;margin-bottom:12px;overflow:hidden;position:relative;background:linear-gradient(135deg,#3390ec,#2563eb);">
        <img id="modalImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;" />
        <div id="modalPlaceholder" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:0 16px;">
          <span style="font-size:36px;font-weight:bold;line-height:1.2;">ВАШ</span>
          <span style="font-size:22px;font-weight:bold;margin-top:6px;line-height:1.2;">Готовый Арендный Бизнес</span>
          <span style="font-size:15px;opacity:0.85;margin-top:10px;">ГАБ Калькулятор</span>
        </div>
      </div>
     
      <h3 id="modalTitle" style="margin:0 0 4px 0;font-size:20px;"></h3>
      <div id="modalPrice" style="font-size:22px;font-weight:700;color:var(--btn-bg,#3390ec);margin-bottom:6px;"></div>
      <div style="color:var(--hint,#888);font-size:14px;margin-bottom:10px;">
        <span id="modalCity"></span> • <span id="modalLoc"></span> • <span id="modalType"></span>
      </div>
      <div style="background:#e6f4ea;color:#1e7e34;padding:6px 10px;border-radius:6px;font-weight:600;font-size:14px;display:inline-block;margin-bottom:12px;">
        Доходность: <span id="modalYield">0%</span>
      </div>
     
      <div id="modalDescription" class="hidden" style="margin-bottom:12px;padding:10px;background:var(--secondary-bg,#f5f5f5);border-radius:8px;font-size:14px;line-height:1.5;"></div>
     
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button id="modalCalcBtn" class="tg-btn">💰 Рассчитать доходность</button>
        <button id="modalContactBtn" style="width:100%;padding:14px;background:var(--secondary-bg,#f0f2f5);color:var(--btn-bg,#3390ec);border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;">📞 Связаться</button>
        <div style="display:flex;gap:10px;">
          <button id="modalCopyLinkBtn" style="flex:1;padding:12px;background:var(--secondary-bg,#f0f2f5);border:none;border-radius:8px;color:var(--btn-bg,#3390ec);font-weight:500;cursor:pointer;">🔗 Копировать</button>
          <button id="modalShareBtn" style="flex:1;padding:12px;background:var(--secondary-bg,#f0f2f5);border:none;border-radius:8px;color:var(--btn-bg,#3390ec);font-weight:500;cursor:pointer;">↗️ Поделиться</button>        </div>
      </div>

      <div id="modalCalcResult" class="hidden" style="margin-top:16px;padding:14px;background:var(--secondary-bg,#f5f5f5);border-radius:10px;border-left:4px solid var(--btn-bg,#3390ec);">
        <div style="font-size:14px;margin-bottom:4px;">💰 Доход: <strong id="mResMonthly"></strong></div>
        <div style="font-size:14px;margin-bottom:4px;">📈 Доходность: <strong id="mResYield"></strong></div>
        <div style="font-size:14px;margin-bottom:12px;">⏳ Окупаемость: <strong id="mResPayback"></strong></div>
        <button id="modalShareCalcBtn" style="width:100%;padding:12px;background:var(--btn-bg,#3390ec);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;">↗️ Поделиться расчётом</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    (function() {
      'use strict';
      const BASE_URL = window.location.origin + window.location.pathname;
      const CONTACT_LINK = 'https://t.me/newgab_bot';
      const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
      const SHEET_NAME = 'Sheet1';
      const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
      const CACHE_KEY = 'gab_cache_v2';
      const CACHE_TTL = 6 * 60 * 60 * 1000;

      let tg = null, isInTelegram = false;
      try {
        if (window.Telegram?.WebApp) {
          tg = window.Telegram.WebApp;
          isInTelegram = tg.initData !== '' && tg.initData !== undefined;
          if (isInTelegram) {
            tg.ready(); tg.expand();
            if (tg.themeParams) {
              document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
              document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
              document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#3390ec');
            }
          }
        }
      } catch(e) {}

      const fmt = n => new Intl.NumberFormat('ru-RU').format(n || 0);
      const showToast = msg => {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 2500);
      };

      // Данные
      let objects = [], filtered = [], currentObj = null;      const calcYield = (p, r) => (p && r && p > 0) ? (r * 12 / p) * 100 : 0;

      // Кэш
      const getCache = () => {
        try {
          const c = JSON.parse(localStorage.getItem(CACHE_KEY));
          return (c && Date.now() - c.t < CACHE_TTL) ? c.d : null;
        } catch { return null; }
      };
      const saveCache = d => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({d, t: Date.now()})); } catch{} };

      // Отрисовка списка (Делегирование событий)
      const renderList = () => {
        const el = document.getElementById('objectsList');
        const city = document.getElementById('cityFilter').value;
        const type = document.getElementById('typeFilter').value;
        const minY = Number(document.getElementById('yieldFilter').value);
        document.getElementById('yieldValue').textContent = minY + '%';

        filtered = objects.filter(o =>
          (!city || o.city.includes(city)) &&
          (!type || o.type === type) &&
          o.yield >= minY
        );

        if (!filtered.length) {
          el.innerHTML = '<div class="empty">😕 Объекты не найдены</div>';
          return;
        }

        el.innerHTML = filtered.map(o => `
          <div class="card" data-id="${o.id}">
            <div class="card-meta">
              <span>${o.city || ''}</span>
              <span class="card-yield">${o.yield.toFixed(1)}%</span>
            </div>
            <h3>${o.title}</h3>
            <div class="card-price">${fmt(o.price)} ₽</div>
            <small>Аренда: ${fmt(o.rent)} ₽/мес</small>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="card-btn btn-copy" data-id="${o.id}">🔗 Копировать ссылку</button>
              <button class="card-btn btn-share" data-id="${o.id}">↗️ Поделиться</button>
            </div>
          </div>
        `).join('');
      };

      // Обработчик кликов по списку
      document.getElementById('objectsList').addEventListener('click', e => {
        const card = e.target.closest('.card');        const copyBtn = e.target.closest('.btn-copy');
        const shareBtn = e.target.closest('.btn-share');

        if (copyBtn) {
          e.stopPropagation();
          const id = copyBtn.dataset.id;
          const obj = objects.find(o => o.id == id);
          if (obj) copyLink(BASE_URL + '#obj-' + obj.id);
          return;
        }
        if (shareBtn) {
          e.stopPropagation();
          const id = shareBtn.dataset.id;
          const obj = objects.find(o => o.id == id);
          if (obj) shareObject(obj);
          return;
        }
        if (card) {
          openModal(card.dataset.id);
        }
      });

      // Модалка
      const modalOverlay = document.getElementById('modalOverlay');
      const openModal = id => {
        const obj = objects.find(o => o.id == id);
        if (!obj) return;
        currentObj = obj;

        const img = document.getElementById('modalImg');
        const ph = document.getElementById('modalPlaceholder');
        if (obj.photo_url?.trim()) {
          img.src = obj.photo_url; img.style.display = 'block'; ph.style.display = 'none';
          img.onerror = () => { img.style.display = 'none'; ph.style.display = 'flex'; };
        } else {
          img.style.display = 'none'; ph.style.display = 'flex';
        }

        document.getElementById('modalTitle').textContent = obj.title;
        document.getElementById('modalPrice').textContent = fmt(obj.price) + ' ₽';
        document.getElementById('modalCity').textContent = obj.city;
        document.getElementById('modalLoc').textContent = obj.location;
        document.getElementById('modalType').textContent = obj.type;
        document.getElementById('modalYield').textContent = obj.yield.toFixed(1) + '%';

        const desc = document.getElementById('modalDescription');
        if (obj.description?.trim()) {
          desc.textContent = obj.description; desc.classList.remove('hidden');
        } else {
          desc.classList.add('hidden');        }

        document.getElementById('modalCalcResult').classList.add('hidden');
        modalOverlay.classList.add('active');
        history.pushState({m:1}, '', '#obj-'+id);
      };

      const closeModal = () => {
        modalOverlay.classList.remove('active');
        if (history.state?.m) history.back();
      };
      document.getElementById('closeModalBtn').onclick = closeModal;
      modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) closeModal(); });
      window.addEventListener('popstate', () => { if(modalOverlay.classList.contains('active')) closeModal(); });

      // Кнопки модалки
      document.getElementById('modalCalcBtn').onclick = () => {
        if (!currentObj) return;
        const p = currentObj.price, r = currentObj.rent;
        const annual = r * 12;
        document.getElementById('mResMonthly').textContent = fmt(r) + ' ₽';
        document.getElementById('mResYield').textContent = (annual / p * 100).toFixed(2) + '%';
        document.getElementById('mResPayback').textContent = (p / annual).toFixed(1) + ' лет';
        document.getElementById('modalCalcResult').classList.remove('hidden');
      };

      document.getElementById('modalShareCalcBtn').onclick = () => {
        const txt = `🧮 Расчёт: ${currentObj.title}\n💰 ${document.getElementById('mResMonthly').textContent}\n📈 ${document.getElementById('mResYield').textContent}`;
        shareLink(BASE_URL, txt);
      };

      document.getElementById('modalShareBtn').onclick = () => {
        if (currentObj) shareObject(currentObj);
      };

      document.getElementById('modalCopyLinkBtn').onclick = () => {
        if (currentObj) copyLink(BASE_URL + '#obj-' + currentObj.id);
      };

      document.getElementById('modalContactBtn').onclick = () => {
        if (!currentObj) return;
        const msg = `Здравствуйте! Интересует объект: ${currentObj.title} (${fmt(currentObj.price)} ₽)`;
        const link = `${CONTACT_LINK}?text=${encodeURIComponent(msg)}`;
        if (isInTelegram) tg.openLink(link);
        else window.open(link, '_blank');
      };

      // Утилиты шаринга/копирования
      const copyLink = url => {
        navigator.clipboard.writeText(url).then(() => showToast('🔗 Ссылка скопирована'));      };

      const shareObject = obj => {
        const url = BASE_URL + '#obj-' + obj.id;
        const text = `🏠 ${obj.title}\n💰 ${fmt(obj.price)} ₽\n📈 ${obj.yield.toFixed(1)}% доходность`;
        shareLink(url, text);
      };

      const shareLink = (url, text) => {
        if (isInTelegram) {
          tg.openLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
        } else if (navigator.share) {
          navigator.share({title: text.split('\n')[0], text, url}).catch(() => copyLink(url));
        } else {
          copyLink(url);
        }
      };

      // Главный калькулятор
      document.getElementById('calcBtn').onclick = () => {
        const p = parseFloat(document.getElementById('calcPrice').value) || 0;
        const r = parseFloat(document.getElementById('calcRent').value) || 0;
        if (p <= 0 || r <= 0) return showToast('Введите цену и аренду');
       
        const annual = r * 12;
        document.getElementById('resMonthly').textContent = fmt(r) + ' ₽';
        document.getElementById('resYield').textContent = (annual / p * 100).toFixed(2) + '%';
        document.getElementById('resPayback').textContent = (p / annual).toFixed(1) + ' лет';
        document.getElementById('calcResult').classList.remove('hidden');
        document.getElementById('shareCalcBtn').style.display = 'block';
      };

      document.getElementById('shareCalcBtn').onclick = () => {
        const txt = `🧮 Расчёт ГАБ\n💰 ${document.getElementById('resMonthly').textContent}\n📈 ${document.getElementById('resYield').textContent}`;
        shareLink(BASE_URL, txt);
      };

      // Фильтры
      ['cityFilter', 'typeFilter', 'yieldFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderList);
      });

      // Загрузка данных (Кэш-первый, фоновое обновление)
      const loadData = async () => {
        const cached = getCache();
        if (cached) {
          objects = cached;
          filtered = [...objects];
          renderList();
          showToast('✅ Загружено из кэша');          // Фоновое обновление
          fetchSheetData(true);
          return;
        }
       
        document.getElementById('objectsList').innerHTML = '<div class="loading">⏳ Загрузка...</div>';
        await fetchSheetData(false);
      };

      const fetchSheetData = async (isBackgroundUpdate) => {
        try {
          const res = await fetch(SHEET_URL, {signal: AbortSignal.timeout(8000)});
          const txt = await res.text();
          const rows = JSON.parse(txt.substring(47).slice(0, -2)).table.rows.filter(r => r.c?.[0]?.v != null);
         
          objects = rows.map(r => {
            const p = Number(r.c[3]?.v) || 0;
            const rent = Number(r.c[4]?.v) || 0;
            const sheetYield = Number(r.c[5]?.v) || 0;
            return {
              id: r.c[0].v,
              title: r.c[1]?.v || 'Без названия',
              type: r.c[2]?.v || '',
              price: p, rent,
              yield: sheetYield > 0 ? sheetYield : calcYield(p, rent),
              city: r.c[6]?.v || '',
              location: r.c[7]?.v || '',
              photo_url: r.c[8]?.v || '',
              description: r.c[9]?.v || ''
            };
          });
         
          saveCache(objects);
          filtered = [...objects];
          renderList();
          if (!isBackgroundUpdate) showToast('✅ Загружено ' + objects.length + ' объектов');
        } catch (e) {
          console.warn('Fetch error:', e);
          if (!isBackgroundUpdate && objects.length === 0) {
            document.getElementById('objectsList').innerHTML = `<div class="error">❌ Ошибка загрузки<br><small>${e.message}</small></div>`;
          }
        }
      };

      // Инициализация
      window.addEventListener('DOMContentLoaded', () => {
        loadData();
        if (window.location.hash.startsWith('#obj-')) {
          setTimeout(() => openModal(window.location.hash.replace('#obj-', '')), 200);
        }      });
    })();
  </script>
</body>
</html>
