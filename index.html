<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GAB Калькулятор — расчёт доходности готового арендного бизнеса">
  <title>GAB Калькулятор — Доходная недвижимость</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏢 GAB Калькулятор</h1>
      <p class="hint">Выберите объект → рассчитайте чистую доходность</p>
    </header>

    <section class="filters">
      <label>Тип объекта</label>
      <select id="typeFilter">
        <option value="all">Все типы</option>
        <option value="retail">Стрит-ритейл</option>
        <option value="office">Офис</option>
        <option value="warehouse">Склад</option>
        <option value="apartments">Апартаменты</option>
        <option value="hypermarket">Гипермаркет</option>
        <option value="pvz">ПВЗ</option>
        <option value="pharmacy">Аптека</option>
        <option value="other">Другое</option>
      </select>
     
      <label>Мин. доходность: <span id="yieldVal">8</span>%</label>
      <input type="range" id="yieldFilter" min="4" max="15" value="8" step="0.5">
    </section>

    <section id="objectsList" class="list"></section>

    <section class="calculator">
      <h2> Калькулятор доходности</h2>
      <div class="calc-grid">
        <div class="input-group">
          <label>Цена объекта (₽)</label>
          <input type="number" id="calcPrice" placeholder="5000000" value="5000000">
        </div>
        <div class="input-group">
          <label>Аренда/мес (₽)</label>
          <input type="number" id="calcRent" placeholder="45000" value="45000">
