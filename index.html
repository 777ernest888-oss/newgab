<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>ГАБ Калькулятор</h1>
      <p class="hint">Подбор готового арендного бизнеса для пассивного дохода</p>
    </header>

    <section class="filters">
      <label>Город
        <select id="cityFilter">
          <option value="">Все города</option>
          <option value="Москва">Москва</option>
          <option value="Санкт-Петербург">Санкт-Петербург</option>
          <option value="Московская">Московская область</option>
        </select>
      </label>
      <label>Тип объекта
        <select id="typeFilter">
          <option value="">Все типы</option>
          <option value="pharmacy">Аптека</option>
          <option value="hypermarket">Супермаркет</option>
          <option value="pvz">ПВЗ</option>
          <option value="darkstore">Даркстор</option>
          <option value="combo">Комбо</option>
          <option value="other">Другое</option>
        </select>
      </label>
      <label>Доходность: <span id="yieldValue">0%</span>
        <input type="range" id="yieldFilter" min="0" max="30" value="0" />
      </label>
    </section>

    <!-- Калькулятор теперь виден сразу (убран класс hidden) -->
    <section class="calculator" id="calculatorSection">
      <h2>🧮 Калькулятор доходности</h2>
      <div class="input-group">
        <label>Цена объекта (₽)
          <input type="number" id="calcPrice" placeholder="5 000 000" />
        </label>
        <label>Аренда в месяц (₽)
          <input type="number" id="calcRent" placeholder="40 000" />
        </label>        <button class="tg-btn" id="calcBtn">Рассчитать</button>
      </div>
      <div id="calcResult" class="result hidden">
        <div class="res-row"><span>Доход в месяц:</span><span id="resMonthly">—</span></div>
        <div class="res-row"><span>Доходность:</span><span id="resYield">—</span></div>
        <div class="res-row"><span>Окупаемость:</span><span id="resPayback">—</span></div>
        <button class="tg-btn" id="shareCalcBtn" style="margin-top:12px;display:none">↗️ Поделиться расчётом</button>
      </div>
      <div id="selectedObject" class="hidden" style="margin-top:12px;padding:12px;background:var(--secondary-bg);border-radius:10px">
        <strong id="selName"></strong><br>
        <small id="selLoc" style="color:var(--hint)"></small>
      </div>
    </section>

    <section id="objectsList" class="list">
      <div class="loading">⏳ Загружаем объекты...</div>
    </section>
  </div>

  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img id="modalImg" src="" alt="" class="modal-img" />
      <h3 id="modalTitle"></h3>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-meta">
        <span id="modalCity"></span> • <span id="modalLoc"></span> • <span id="modalType"></span>
      </div>
      <div class="modal-yield">Доходность: <strong id="modalYield"></strong></div>
      <div class="modal-actions">
        <button class="tg-btn" id="modalCalcBtn">💰 Рассчитать доходность</button>
        <button class="tg-btn" id="modalContactBtn" style="background:var(--secondary-bg);color:var(--btn-bg)"> Связаться</button>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="card-btn" id="modalCopyLinkBtn">🔗 Копировать ссылку</button>
          <button class="card-btn" id="modalShareBtn">↗️ Поделиться</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    // ==================== НАСТРОЙКИ ====================
    const BASE_URL = window.location.origin + window.location.pathname;
    const CONTACT_LINK = 'https://t.me/newgab_bot';
    const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
    const SHEET_NAME = 'Sheet1';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    let tg = null;
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        if (tg.themeParams) {
          document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
          document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
          document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#3390ec');
          document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
        }
      }
    } catch (e) { console.warn('Telegram WebApp error:', e); }

    const fmt = (num) => new Intl.NumberFormat('ru-RU').format(num);
   
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('🔗 Ссылка скопирована!');
      }).catch(() => showToast('❌ Ошибка', 'error'));
    }

    function shareObject(obj) {
      const shareUrl = BASE_URL + '#obj-' + obj.id;
      const shareText = '🏠 ' + obj.title + '\n💰 ' + fmt(obj.price) + ' ₽\n📈 ' + (obj.yield || 0) + '% доходность';

      if (tg) {
        tg.openLink('https://t.me/share/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(shareText));
      } else if (navigator.share) {
        navigator.share({ title: obj.title, text: shareText, url: shareUrl }).catch(() => copyLink(shareUrl));
      } else {
        copyLink(shareUrl);
      }
    }

    let objects = [], filtered = [], currentObj = null;

    async function loadData() {
      const listEl = document.getElementById('objectsList');
      listEl.innerHTML = '<div class="loading">⏳ Загружаем объекты...</div>';
            try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows.filter(r => r.c && r.c[0] && r.c[0].v);
       
        objects = rows.map(r => ({
          id: r.c[0].v || '',
          title: r.c[1].v || '',
          type: r.c[2].v || '',          // Столбец C
          price: Number(r.c[3].v) || 0,  // Столбец D
          rent: Number(r.c[4].v) || 0,   // Столбец E
          yield: Number(r.c[5].v) || 0,  // Столбец F
          city: r.c[6].v || '',          // Столбец G (Регион)
          location: r.c[7].v || ''       // Столбец H (Локация)
        }));
       
        filtered = [...objects];
        renderList();
        showToast('✅ Загружено ' + objects.length + ' объектов', 'success');
      } catch (e) {
        console.error(e);
        listEl.innerHTML = '<div class="error">Ошибка загрузки данных. Проверьте доступ к таблице.</div>';
      }
    }

    function renderList() {
      const listEl = document.getElementById('objectsList');
      const city = document.getElementById('cityFilter').value;
      const type = document.getElementById('typeFilter').value;
      const minYield = Number(document.getElementById('yieldFilter').value);
     
      document.getElementById('yieldValue').textContent = minYield + '%';
     
      filtered = objects.filter(o =>
        (!city || o.city.includes(city)) &&
        (!type || o.type === type) &&
        (o.yield >= minYield)
      );
     
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">😕 Объекты не найдены</div>';
        return;
      }
     
      listEl.innerHTML = filtered.map((obj, i) => `
        <div class="card" onclick="openModal(objects.find(o=>o.id=='${obj.id}'))">
          <div class="card-meta">
            <span>${obj.city || ''}</span>
            <span class="card-yield">${obj.yield}%</span>          </div>
          <h3>${obj.title}</h3>
          <div class="card-price">${fmt(obj.price)} ₽</div>
          <small>Аренда: ${fmt(obj.rent)} ₽/мес</small>
          <div style="display:flex;gap:8px;margin-top:8px">
             <button class="card-btn btn-copy" onclick="event.stopPropagation();copyLink('${BASE_URL}#obj-${obj.id}')">🔗</button>
             <button class="card-btn btn-share" onclick="event.stopPropagation();shareObject(objects.find(o=>o.id=='${obj.id}'))">↗️</button>
          </div>
        </div>
      `).join('');
    }

    function openModal(obj) {
      currentObj = obj;
      document.getElementById('modalTitle').textContent = obj.title;
      document.getElementById('modalPrice').textContent = fmt(obj.price) + ' ₽';
      document.getElementById('modalCity').textContent = obj.city;
      document.getElementById('modalLoc').textContent = obj.location;
      document.getElementById('modalType').textContent = obj.type;
      document.getElementById('modalYield').textContent = obj.yield + '%';
      document.getElementById('modalOverlay').classList.add('active');
      history.pushState({modal:true}, '', '#obj-'+obj.id);
    }

    window.closeModal = () => {
      document.getElementById('modalOverlay').classList.remove('active');
      if(history.state?.modal) history.back();
    };

    document.getElementById('modalCalcBtn').onclick = () => {
      document.getElementById('calcPrice').value = currentObj.price;
      document.getElementById('calcRent').value = currentObj.rent;
      document.getElementById('selName').textContent = currentObj.title;
      document.getElementById('selLoc').textContent = currentObj.city;
      document.getElementById('selectedObject').classList.remove('hidden');
      document.getElementById('calculatorSection').scrollIntoView({behavior:'smooth'});
      calculate();
      closeModal();
    };
   
    document.getElementById('modalShareBtn').onclick = () => shareObject(currentObj);
    document.getElementById('modalCopyLinkBtn').onclick = () => copyLink(BASE_URL + '#obj-' + currentObj.id);
   
    document.getElementById('calcBtn').onclick = calculate;
   
    function calculate() {
      const p = parseFloat(document.getElementById('calcPrice').value) || 0;
      const r = parseFloat(document.getElementById('calcRent').value) || 0;
      if(p<=0 || r<=0) return;
            const annual = r*12;
      const y = (annual/p)*100;
      const pay = p/annual;
     
      document.getElementById('resMonthly').textContent = fmt(r) + ' ₽';
      document.getElementById('resYield').textContent = y.toFixed(2) + '%';
      document.getElementById('resPayback').textContent = pay.toFixed(1) + ' лет';
      document.getElementById('calcResult').classList.remove('hidden');
      document.getElementById('shareCalcBtn').style.display = 'block';
    }

    document.getElementById('cityFilter').onchange = renderList;
    document.getElementById('typeFilter').onchange = renderList;
    document.getElementById('yieldFilter').oninput = renderList;

    window.addEventListener('load', () => {
      loadData();
      if(window.location.hash.startsWith('#obj-')) {
        const id = window.location.hash.replace('#obj-','');
        setTimeout(() => {
          const obj = objects.find(o=>o.id==id);
          if(obj) openModal(obj);
        }, 1000);
      }
    });
  </script>
</body>
</html>
