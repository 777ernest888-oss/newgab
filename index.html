<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>GAB Калькулятор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    .contact-btn { background-color: #ffffff; color: #3390ec; border: 1px solid #3390ec; }
    .contact-btn:hover { background-color: #f0f7ff; }
    .card-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .card-buttons button { flex: 1; }
    .error-msg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
    .obj-badge { background:#f0f7ff; border:1px solid #3390ec; padding:10px; border-radius:8px; margin-bottom:15px; display:none; }
    .obj-badge-title { font-weight:bold; font-size:15px; }
    .obj-badge-loc { font-size:13px; color:#444; margin-top:2px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏢 GAB Калькулятор</h1>
      <p class="hint">Выберите объект → рассчитайте доходность</p>
    </header>

    <section class="filters">
      <label>Тип объекта</label>
      <select id="typeFilter">
        <option value="all">Все типы</option>
        <option value="retail">Стрит-ритейл</option>
        <option value="office">Офис</option>
        <option value="warehouse">Склад</option>
        <option value="apartments">Апартаменты</option>
        <option value="hypermarket">Гипермаркет</option>
        <option value="pvz">ПВЗ</option>
        <option value="pharmacy">Аптека</option>
        <option value="other">Другое</option>
      </select>
      <label>Мин. доходность: <span id="yieldVal">8</span>%</label>
      <input type="range" id="yieldFilter" min="4" max="15" value="8" step="0.5">
    </section>

    <section id="objectsList" class="list">
      <p style="text-align:center;">⏳ Загрузка объектов...</p>
    </section>

    <section class="calculator">      <h2> Калькулятор доходности</h2>
     
      <div id="selectedObject" class="obj-badge">
        <div style="font-size:12px; color:#666; margin-bottom:4px;">📊 Рассчитываем для:</div>
        <div class="obj-badge-title" id="selectedObjectName"></div>
        <div class="obj-badge-loc" id="selectedObjectLocation"></div>
      </div>

      <div class="calc-grid">
        <div class="input-group"><label>Цена объекта (₽)</label><input type="number" id="calcPrice" placeholder="5000000"></div>
        <div class="input-group"><label>Аренда/мес (₽)</label><input type="number" id="calcRent" placeholder="45000"></div>
      </div>
      <button id="calcBtn" class="tg-btn">Рассчитать доходность</button>

      <div id="calcResult" class="result hidden">
        <div class="res-row"><span>💰 Аренда/мес:</span><span id="resMonthly" style="font-weight:bold; color:#28a745">0 ₽</span></div>
        <div class="res-row"><span>📈 Годовая доходность:</span><span id="resYield" style="font-weight:bold; color:#007bff">0%</span></div>
        <div class="res-row"><span>⏳ Окупаемость:</span><span id="resPayback" style="font-weight:bold; color:#ffc107">0 лет</span></div>
      </div>
    </section>
  </div>

  <script>
    (function() {
      const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
      const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&v=${Date.now()}`;
     
      const listEl = document.getElementById('objectsList');
      const typeFilter = document.getElementById('typeFilter');
      const yieldFilter = document.getElementById('yieldFilter');
      const yieldVal = document.getElementById('yieldVal');
      const calcBtn = document.getElementById('calcBtn');
      const calcResult = document.getElementById('calcResult');
     
      const inputs = {
        price: document.getElementById('calcPrice'),
        rent: document.getElementById('calcRent')
      };
     
      const outputs = {
        monthly: document.getElementById('resMonthly'),
        yield: document.getElementById('resYield'),
        payback: document.getElementById('resPayback')
      };

      const objBadge = document.getElementById('selectedObject');
      const objName = document.getElementById('selectedObjectName');
      const objLoc = document.getElementById('selectedObjectLocation');

      let objects = [];      const CONTACT_LINK = 'https://t.me/ernest_812';

      function hideBadge() { if (objBadge) objBadge.style.display = 'none'; }
      function showBadge(title, location) {
        if (objName) objName.textContent = title || 'Объект';
        if (objLoc) objLoc.textContent = location ? `📍 ${location}` : '';
        if (objBadge) objBadge.style.display = 'block';
      }

      function parseCSV(csv) {
        const lines = csv.split(/\r?\n/);
        const result = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const row = lines[i].match(/(".*?"|[^",\n]+)(?=\s*,|\s*$)/g) || [];
          const clean = row.map(v => v.replace(/^"|"$/g, '').trim());
          if (clean.length >= 3) {
            const price = parseFloat(clean[3]) || 0;
            const rent = parseFloat(clean[4]) || 0;
            let yieldVal = parseFloat(clean[5]);
            if (!yieldVal && price > 0) yieldVal = (rent * 12 / price) * 100;
            result.push({
              id: clean[0], title: clean[1], type: clean[2], price, rent,
              yield: yieldVal || 0, location: clean[6] || '', risks: clean[7] || ''
            });
          }
        }
        return result;
      }

      async function loadObjects() {
        try {
          const res = await fetch(SHEET_URL);
          if (!res.ok) throw new Error('Сеть недоступна');
          const csv = await res.text();
          objects = parseCSV(csv).filter(o => o.price > 0);
          renderList();
        } catch (e) {
          console.error(e);
          listEl.innerHTML = '<div class="error-msg">⚠️ Не удалось загрузить базу.<br>Проверьте интернет.</div>';
        }
      }

      function renderList() {
        const type = typeFilter ? typeFilter.value : 'all';
        const minYield = yieldFilter ? parseFloat(yieldFilter.value) : 8;
        if (yieldVal) yieldVal.textContent = minYield;
        const filtered = objects.filter(o => (type === 'all' || o.type === type) && o.yield >= minYield);
       
        listEl.innerHTML = filtered.length ? filtered.map(o => {          const safeTitle = (o.title || '').replace(/'/g, "\\'");
          const safeLoc = (o.location || '').replace(/'/g, "\\'");
          return `
          <div class="card">
            <div class="card-meta"><span>📍 ${o.location}</span><span class="card-yield">≈${o.yield.toFixed(1)}%</span></div>
            <h3>${o.title}</h3>
            <div class="card-price">${(o.price / 1000000).toFixed(2)} млн ₽</div>
            <div style="font-size:13px;color:#666">Аренда: ${o.rent.toLocaleString()} ₽/мес</div>
            <div class="card-buttons">
              <button class="card-btn" onclick="loadToCalc(${o.price}, ${o.rent}, '${safeTitle}', '${safeLoc}')">📥 Калькулятор</button>
              <button class="card-btn contact-btn" onclick="window.open('${CONTACT_LINK}?text=Здравствуйте! Интересует объект: ${safeTitle} (${o.price} ₽)')">💬 Связаться</button>
            </div>
          </div>`;
        }).join('') : '<p style="text-align:center;color:#999;padding:20px">Нет объектов по фильтру</p>';
      }

      window.loadToCalc = function(p, r, title, location) {
        inputs.price.value = p;
        inputs.rent.value = r;
        showBadge(title, location);
        calculate();
        document.querySelector('.calculator').scrollIntoView({ behavior: 'smooth' });
      };

      if (inputs.price) inputs.price.addEventListener('input', hideBadge);
      if (inputs.rent) inputs.rent.addEventListener('input', hideBadge);

      function calculate() {
        const price = parseFloat(inputs.price.value) || 0;
        const rent = parseFloat(inputs.rent.value) || 0;

        if (price <= 0 || rent <= 0) return alert('Укажите цену и аренду');

        const annualIncome = rent * 12;
        const yieldPercent = (annualIncome / price) * 100;
        const paybackYears = price / annualIncome;

        if (outputs.monthly) outputs.monthly.textContent = Math.round(rent).toLocaleString() + ' ₽';
        if (outputs.yield) outputs.yield.textContent = yieldPercent.toFixed(2) + '%';
        if (outputs.payback) outputs.payback.textContent = paybackYears.toFixed(1) + ' лет';
        if (calcResult) calcResult.classList.remove('hidden');
      }

      typeFilter?.addEventListener('change', renderList);
      yieldFilter?.addEventListener('input', renderList);
      calcBtn?.addEventListener('click', calculate);
      loadObjects();
    })();
  </script>
</body></html>
