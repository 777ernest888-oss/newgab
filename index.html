<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>GAB Калькулятор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Стили для ошибки загрузки */
    .error-msg { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏢 GAB Калькулятор</h1>
      <p class="hint">Выберите объект → рассчитайте доходность</p>
    </header>

    <section class="filters">
      <label>Тип объекта</label>
      <select id="typeFilter">
        <option value="all">Все типы</option>
        <option value="retail">Стрит-ритейл</option>
        <option value="office">Офис</option>
        <option value="warehouse">Склад</option>
        <option value="apartments">Апартаменты</option>
        <option value="hypermarket">Гипермаркет</option>
        <option value="pvz">ПВЗ</option>
        <option value="pharmacy">Аптека</option>
        <option value="other">Другое</option>
      </select>
      <label>Мин. доходность: <span id="yieldVal">8</span>%</label>
      <input type="range" id="yieldFilter" min="4" max="15" value="8" step="0.5">
    </section>

    <section id="objectsList" class="list">
      <p style="text-align:center;">⏳ Загрузка объектов...</p>
    </section>

    <section class="calculator">
      <h2> Калькулятор доходности</h2>
      <div class="calc-grid">
        <div class="input-group"><label>Цена объекта (₽)</label><input type="number" id="calcPrice" placeholder="5000000"></div>
        <div class="input-group"><label>Аренда/мес (₽)</label><input type="number" id="calcRent" placeholder="45000"></div>
        <div class="input-group"><label>Простой в году (%)</label><input type="number" id="calcVacancy" placeholder="10" value="10"></div>
        <div class="input-group"><label>Расходы/мес (₽)</label><input type="number" id="calcExpenses" placeholder="3000" value="3000"></div>
        <div class="input-group"><label>Налог (%)</label><input type="number" id="calcTax" placeholder="6" value="6"></div>      </div>
      <button id="calcBtn" class="tg-btn">Рассчитать чистую доходность</button>

      <div id="calcResult" class="result hidden">
        <div class="res-row"><span>💰 Чистый доход/мес:</span><span id="resMonthly" style="font-weight:bold; color:#28a745">0 ₽</span></div>
        <div class="res-row"><span>📈 Годовая доходность:</span><span id="resYield" style="font-weight:bold; color:#007bff">0%</span></div>
        <div class="res-row"><span>⏳ Окупаемость:</span><span id="resPayback" style="font-weight:bold; color:#ffc107">0 лет</span></div>
      </div>
    </section>
  </div>

  <script>
    (function() {
      const SHEET_ID = '1tLCnDY0j9GNpVde3P9XF9VVjpi2xLGXy_3ScYxEYSXk';
      const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
     
      const listEl = document.getElementById('objectsList');
      const typeFilter = document.getElementById('typeFilter');
      const yieldFilter = document.getElementById('yieldFilter');
      const yieldVal = document.getElementById('yieldVal');
      const calcBtn = document.getElementById('calcBtn');
      const calcResult = document.getElementById('calcResult');
     
      const inputs = {
        price: document.getElementById('calcPrice'),
        rent: document.getElementById('calcRent'),
        vacancy: document.getElementById('calcVacancy'),
        expenses: document.getElementById('calcExpenses'),
        tax: document.getElementById('calcTax')
      };
     
      const outputs = {
        monthly: document.getElementById('resMonthly'),
        yield: document.getElementById('resYield'),
        payback: document.getElementById('resPayback')
      };

      let objects = [];

      async function loadObjects() {
        // ТАЙМАУТ: Если Google не ответит за 5 секунд, прерываем
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        try {
          const response = await fetch(SHEET_URL, { signal: controller.signal });
          clearTimeout(timeoutId); // Остановить таймер, если всё ОК
         
          const text = await response.text();
          const jsonString = text.substring(47).slice(0, -2);          const json = JSON.parse(jsonString);
         
          const rows = json.table.rows.filter(row => row.c && row.c[0]);
         
          objects = rows.map(row => ({
            id: row.c[0]?.v,
            title: row.c[1]?.v || 'Без названия',
            type: row.c[2]?.v || 'retail',
            price: parseFloat(row.c[3]?.v) || 0,
            rent: parseFloat(row.c[4]?.v) || 0,
            yield: parseFloat(row.c[5]?.v) || 0,
            location: row.c[6]?.v || '',
            risks: row.c[7]?.v || ''
          })).filter(obj => obj.price > 0);

          renderList();

        } catch (e) {
          console.error("Ошибка загрузки:", e);
          // Показываем ошибку пользователю, а не вечную загрузку
          if (e.name === 'AbortError') {
             listEl.innerHTML = '<div class="error-msg">⚠️ Google Таблицы не отвечают.<br>Проверьте интернет или отключите AdBlock.</div>';
          } else {
             listEl.innerHTML = '<div class="error-msg">⚠️ Ошибка данных.<br>Попробуйте обновить страницу.</div>';
          }
        }
      }

      function renderList() {
        const type = typeFilter ? typeFilter.value : 'all';
        const minYield = yieldFilter ? parseFloat(yieldFilter.value) : 8;
        if (yieldVal) yieldVal.textContent = minYield;

        const filtered = objects.filter(obj =>
          (type === 'all' || obj.type === type) && obj.yield >= minYield
        );

        if (filtered.length === 0) {
          listEl.innerHTML = '<p style="text-align:center;color:#999;padding:20px">Нет объектов по фильтру</p>';
          return;
        }

        listEl.innerHTML = filtered.map(obj => `
          <div class="card" onclick="loadToCalc(${obj.price}, ${obj.rent})">
            <div class="card-meta"><span>📍 ${obj.location}</span><span class="card-yield">≈${obj.yield}%</span></div>
            <h3>${obj.title}</h3>
            <div class="card-price">${(obj.price / 1000000).toFixed(2)} млн ₽</div>
            <div style="font-size:13px;color:#666">Аренда: ${obj.rent.toLocaleString()} ₽/мес</div>
            <button class="card-btn">📥 Загрузить в калькулятор</button>
          </div>        `).join('');
      }

      window.loadToCalc = function(price, rent) {
        inputs.price.value = price;
        inputs.rent.value = rent;
        calculate();
        document.querySelector('.calculator').scrollIntoView({ behavior: 'smooth' });
      };

      function calculate() {
        const price = parseFloat(inputs.price.value) || 0;
        const rent = parseFloat(inputs.rent.value) || 0;
        const vacancy = parseFloat(inputs.vacancy.value) || 0;
        const expenses = parseFloat(inputs.expenses.value) || 0;
        const taxRate = parseFloat(inputs.tax.value) || 0;

        if (price <= 0 || rent <= 0) {
          alert('Укажите цену и аренду');
          return;
        }

        const grossAnnual = rent * 12;
        const vacancyLoss = grossAnnual * (vacancy / 100);
        const effectiveIncome = grossAnnual - vacancyLoss;
        const expensesAnnual = expenses * 12;
        const taxAnnual = effectiveIncome * (taxRate / 100);
        const netAnnual = effectiveIncome - expensesAnnual - taxAnnual;

        const netMonthly = netAnnual / 12;
        const annualYield = (netAnnual / price) * 100;
        const paybackYears = netAnnual > 0 ? price / netAnnual : 99;

        if (outputs.monthly) outputs.monthly.textContent = Math.round(netMonthly).toLocaleString() + ' ₽';
        if (outputs.yield) outputs.yield.textContent = annualYield.toFixed(2) + '%';
        if (outputs.payback) outputs.payback.textContent = paybackYears.toFixed(1) + ' лет';

        if (calcResult) calcResult.classList.remove('hidden');
      }

      if (typeFilter) typeFilter.addEventListener('change', renderList);
      if (yieldFilter) yieldFilter.addEventListener('input', renderList);
      if (calcBtn) calcBtn.addEventListener('click', calculate);

      // Запуск
      loadObjects();
    })();
  </script>
</body>
</html>
