<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ГАБ Калькулятор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="loadingScreen" class="loading-screen hidden">
    <div class="loading-spinner"></div>
    <div>⏳ Загружаем объекты...</div>
  </div>

  <!-- ПРИВЕТСТВИЕ -->
  <div id="welcomeScreen" class="screen welcome">
    <div class="welcome-brand">
      <img class="brand-logo" src="favicon.png" alt="Logo">
      <div class="brand-company">ГАБ КАЛЬКУЛЯТОР</div>
    </div>
   
    <!-- 🎥 ВИДЕО ИЛИ ФОТО -->
    <div class="welcome-media">
      <video id="welcomeVideo" class="welcome-video" autoplay muted loop playsinline style="display: none;">
        <source src="" type="video/mp4">
      </video>
      <img id="welcomeImage" class="welcome-image" src="hero.png" alt="Welcome" style="display: none;">
    </div>
   
    <div class="welcome-bottom">
      <h1 class="welcome-title">ГАБ Калькулятор</h1>
      <p class="welcome-subtitle">Готовый арендный бизнес для пассивного дохода</p>
      <button class="tg-btn" onclick="startApp()">Начать подбор</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <div id="mainContent" class="screen main hidden">
    <div class="container">
      <h1>🏠 Главная</h1>
      <p>Подбор бизнеса для пассивного дохода</p>
     
      <div id="objectsList" class="list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
