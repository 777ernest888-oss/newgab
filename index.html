<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Калькулятор доходности арендного бизнеса. Подбор объектов с доходностью от 10% годовых.">
  <meta name="theme-color" content="#1a365d">
  <title>ГАБ Калькулятор</title>
 
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- 🔄 ЭКРАН ЗАГРУЗКИ -->
  <div id="loadingScreen" class="loading-screen hidden">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загружаем объекты...</div>
  </div>

  <!-- 🏠 ПРИВЕТСТВИЕ -->
  <div id="welcomeScreen" class="screen welcome hidden">
    <div class="welcome-brand">
      <img class="brand-logo" src="favicon.png" alt="Logo">
      <div class="brand-company">ГАБ КАЛЬКУЛЯТОР</div>
    </div>
   
    <!-- Видео ИЛИ Фото -->
    <div class="welcome-media">
      <video id="welcomeVideo" class="welcome-video hidden" autoplay muted loop playsinline>
        <source src="" type="video/mp4">
      </video>
      <img id="welcomeImage" class="welcome-image hidden" src="hero.png" alt="Welcome">
    </div>
   
    <div class="welcome-bottom">
      <h1 id="welcomeTitle">ГАБ Калькулятор</h1>
      <p id="welcomeSubtitle">Готовый арендный бизнес для пассивного дохода</p>
      <button class="tg-btn" onclick="startApp()">Начать подбор</button>
    </div>
  </div>

  <!-- 📋 ОСНОВНОЙ КОНТЕНТ -->
  <div id="mainContent" class="screen main hidden">
   
    <!-- HEADER -->
    <header class="header">
      <button id="customBackBtn" class="header-back-btn hidden" onclick="appBack()" type="button">
        <span class="back-arrow">←</span>
        <span>Назад</span>      </button>
      <div id="headerBrand" class="header-brand"></div>
    </header>

    <!-- ФИЛЬТРЫ -->
    <div class="filters-toggle">
      <button class="filters-toggle-btn" onclick="toggleFilters()" type="button">🔽 Фильтры</button>
    </div>
   
    <div id="filtersBlock" class="filters-block hidden">
      <div class="filter-group">
        <label>🌍 Город</label>
        <div id="cityCheckboxes" class="checkbox-group"></div>
      </div>

      <div class="filter-group">
        <label>🏢 Тип объекта</label>
        <div id="typeCheckboxes" class="checkbox-group"></div>
      </div>

      <div class="filter-group">
        <label>📈 Доходность от (%)</label>
        <input type="range" id="yieldFilter" min="0" max="30" value="0" step="1">
        <div class="range-value" id="yieldValue">0%</div>
      </div>
    </div>

    <!-- ПЕРЕКЛЮЧАТЕЛЬ ВИДА -->
    <div class="view-toggle">
      <button id="listViewBtn" class="view-btn active" onclick="switchView('list')" type="button">📋 Список</button>
      <button id="calcViewBtn" class="view-btn" onclick="switchView('calc')" type="button">🧮 Калькулятор</button>
    </div>

    <!-- КОНТЕЙНЕРЫ -->
    <div id="listingsContainer" class="listings"></div>
   
    <!-- КАЛЬКУЛЯТОР -->
    <div id="calcContainer" class="calculator hidden">
      <div class="calc-card">
        <h3>🧮 Калькулятор доходности</h3>
        <div class="input-group">
          <label>Цена объекта (₽)</label>
          <input type="number" id="calcPrice" placeholder="10000000" value="10000000">
        </div>
        <div class="input-group">
          <label>Аренда в месяц (₽)</label>
          <input type="number" id="calcRent" placeholder="80000" value="80000">
        </div>
        <button class="tg-btn" onclick="calculateYield()" type="button">Рассчитать</button>
                <div id="calcResult" class="result hidden">
          <div class="res-row">Доход в месяц: <span id="resMonth">—</span></div>
          <div class="res-row">Доходность: <span id="resYield">—</span></div>
          <div class="res-row">Окупаемость: <span id="resPayback">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 📋 МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ -->
  <div id="detailsModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()" type="button" aria-label="Закрыть">✕</button>
      <h2 id="modalTitle"></h2>
      <div id="modalGallery" class="modal-gallery"></div>
      <div id="modalPrice" class="modal-price"></div>
      <div id="modalMeta" class="modal-meta"></div>
     
      <div class="modal-section">
        <h3>📖 Описание</h3>
        <div id="modalDescription"></div>
      </div>

      <div class="modal-section">
        <h3>✨ Преимущества</h3>
        <div id="modalFeatures"></div>
      </div>

      <button id="modalConsultBtn" class="tg-btn modal-cta" type="button">📞 Связаться с брокером</button>
    </div>
  </div>

  <!-- 📞 МОДАЛЬНОЕ ОКНО ЗАЯВКИ -->
  <div id="consultModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" onclick="closeConsultModal()" type="button" aria-label="Закрыть">✕</button>
      <h2>Заказать консультацию</h2>
      <p class="form-hint">Оставьте контакты — мы перезвоним и ответим на все вопросы</p>
      <div id="consultObjectName" class="form-object">🏢 Объект</div>
     
      <form id="consultForm" onsubmit="submitConsultForm(event)" class="form-modal">
        <input type="text" id="consultName" placeholder="Ваше имя" required autocomplete="name">
        <input type="tel" id="consultPhone" placeholder="+7 (___) ___-__-__" required autocomplete="tel">
        <button type="submit" class="tg-btn">Отправить заявку</button>
      </form>
    </div>
  </div>

  <!-- Наш скрипт -->
  <script src="app.js?v=2"></script>
</body>
</html>
